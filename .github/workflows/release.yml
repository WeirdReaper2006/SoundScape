name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Version format is Major.Minor (no patch), derived from the latest
      # existing "vX.Y" tag plus the commit-message headings pushed in this run:
      #   "feat!: ..." / "feat(scope)!: ..." (or any "type!:") -> major bump, minor reset to 0
      #   "feat: ..."  / "feat(scope): ..."                    -> minor bump
      #   anything else                                        -> no bump, no release
      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.3"
          fi
          echo "Latest tag: $LATEST_TAG"

          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            SUBJECTS=$(git log -1 --pretty=%s)
          else
            SUBJECTS=$(git log "$BEFORE_SHA".."${{ github.sha }}" --pretty=%s)
          fi
          echo "Commit headings in this push:"
          echo "$SUBJECTS"

          BUMP="none"
          while IFS= read -r subject; do
            if echo "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              BUMP="major"
            elif echo "$subject" | grep -qE '^feat(\([^)]*\))?:' && [ "$BUMP" != "major" ]; then
              BUMP="minor"
            fi
          done <<< "$SUBJECTS"
          echo "Bump: $BUMP"

          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0 ;;
            minor) MINOR=$((MINOR + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR"
          echo "should_release=$([ "$BUMP" = "none" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "New version: v$NEW_VERSION (release: $([ "$BUMP" = "none" ] && echo no || echo yes))"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Release signing is used only when the KEYSTORE_BASE64 secret is configured.
      # Otherwise we fall back to a debug-signed build so the workflow always succeeds.
      - name: Decide build variant
        id: variant
        if: steps.version.outputs.should_release == 'true'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "name=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "name=debug" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.version.outputs.should_release == 'true' && steps.variant.outputs.name == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.version.outputs.should_release == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew ${{ steps.variant.outputs.task }} --no-daemon

      - name: Rename artifact
        id: artifact
        if: steps.version.outputs.should_release == 'true'
        run: |
          mkdir -p release-output
          SRC="app/build/outputs/apk/${{ steps.variant.outputs.name }}/app-${{ steps.variant.outputs.name }}.apk"
          if [ "${{ steps.variant.outputs.name }}" = "release" ]; then
            NAME="SoundScape-${{ steps.version.outputs.tag }}.apk"
          else
            NAME="SoundScape-${{ steps.version.outputs.tag }}-debug.apk"
          fi
          cp "$SRC" "release-output/$NAME"
          echo "path=release-output/$NAME" >> "$GITHUB_OUTPUT"

      # Tag is only created once the build succeeds, and is pushed to the repo
      # as a real ref so the release is published against a tag, not a branch.
      - name: Create and push tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SoundScape ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
